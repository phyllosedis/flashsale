spring.application.name=user-service
server.port=${SERVER_PORT:8081}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flashsale_user}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.liquibase.change-log=classpath:migration/changelog.xml
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Debezium reads the outbox table through the PostgreSQL WAL, so the service only has
# to insert rows and clean them up after the retention window.
app.outbox.retention-days=${OUTBOX_RETENTION_DAYS:7}
app.outbox.cleanup-interval-ms=${OUTBOX_CLEANUP_INTERVAL_MS:3600000}

management.endpoints.web.exposure.include=health,info,metrics
